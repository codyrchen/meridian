[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Research monorepo root (virtual project)"
requires-python = ">=3.12"
dependencies = [
    "meridian-domain",
    "meridian-connectors",
    "meridian-pipelines",
    "meridian-research",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
meridian-domain = { workspace = true }
meridian-connectors = { workspace = true }
meridian-pipelines = { workspace = true }
meridian-research = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/domain/src",
    "packages/connectors/src",
    "packages/pipelines/src",
    "packages/research/src",
]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance (skipped with a message when unreachable)",
]
filterwarnings = ["error::DeprecationWarning:meridian.*"]
