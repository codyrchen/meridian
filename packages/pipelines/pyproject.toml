[project]
name = "meridian-pipelines"
version = "0.1.0"
description = "Orchestration, normalization, and data-quality checks."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "meridian-domain",
    "meridian-connectors",
    "meridian-research",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_pipelines"]
