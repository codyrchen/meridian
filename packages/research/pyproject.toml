[project]
name = "meridian-research"
version = "0.1.0"
description = "Event studies and statistics. Pure computation over explicit inputs."
requires-python = ">=3.12"
dependencies = ["polars>=1.9", "matplotlib>=3.9", "meridian-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_research"]
