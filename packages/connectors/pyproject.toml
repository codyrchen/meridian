[project]
name = "meridian-connectors"
version = "0.1.0"
description = "Source-specific clients and raw ingestion. No database access."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "meridian-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_connectors"]
