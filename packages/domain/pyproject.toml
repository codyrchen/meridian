[project]
name = "meridian-domain"
version = "0.1.0"
description = "Pure domain models and invariants. No network or database access."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_domain"]
